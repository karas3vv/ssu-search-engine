# имя проекта задаёт общий префикс ресурсов docker compose
name: habr-search

services:
  # отдельная база хранит векторы и тексты фрагментов для python-команд
  qdrant:
    # закреплённая версия делает запуск на разных компьютерах воспроизводимым
    image: qdrant/qdrant:v1.19.2
    # перезапускаем сервис при сбоях, сохраняя возможность остановить его вручную
    restart: unless-stopped
    ports:
      # база доступна только с этого компьютера
      - "127.0.0.1:6333:6333"
    volumes:
      # данные сохраняются после остановки и пересоздания контейнера
      - qdrant_storage:/qdrant/storage
      # отдельный том предназначен для снимков состояния базы
      - qdrant_snapshots:/qdrant/snapshots

# именованные тома управляются docker и живут отдельно от исходного кода
volumes:
  qdrant_storage:
  qdrant_snapshots:
